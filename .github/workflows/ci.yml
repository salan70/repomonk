name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt / clippy / test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml が stable と rustfmt / clippy を指定しているため、
      # ランナー同梱の rustup がそのまま解決する。
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      # rusqlite の bundled SQLite と tree-sitter の grammar は C ビルドを伴い、
      # 毎回のビルドが長いためキャッシュする。
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features
