[package]
name = "repomonk"
version = "0.1.0"
edition = "2021"
description = "Type through real GitHub repositories in your terminal"
license = "MIT"
readme = "README.md"
repository = "https://github.com/salan70/repomonk"
keywords = ["typing", "tui", "git", "practice"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
thiserror = "2"
toml = "0.8"
tree-sitter = { version = "0.26.12", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = [
    "lang-rust",
    "lang-typescript",
    "lang-javascript",
    "lang-python",
    "lang-go",
]
lang-rust = ["dep:tree-sitter", "dep:tree-sitter-rust"]
lang-typescript = ["dep:tree-sitter", "dep:tree-sitter-typescript"]
lang-javascript = ["dep:tree-sitter", "dep:tree-sitter-javascript"]
lang-python = ["dep:tree-sitter", "dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter", "dep:tree-sitter-go"]
